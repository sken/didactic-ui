version: 2
updates:
  # Maintain npm / pnpm dependencies in the workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      types:
        patterns:
          - "@types/*"
      storybook:
        patterns:
          - "@storybook/*"
          - "eslint-plugin-storybook"
      lint-format:
        patterns:
          - "eslint*"
          - "prettier*"
      react-dom:
        patterns:
          - "react"
          - "react-dom"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
