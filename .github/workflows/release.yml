# Changesets release (see README "Releasing"): on every push to main,
# changesets/action either
#  - opens or updates a "Version Packages" PR while changesets are pending, or
#  - when none are pending, runs `pnpm release` (build + `changeset publish`),
#    which publishes every package whose version is not on npm yet, then tags
#    it and creates a GitHub release.
# `changeset publish` uses pnpm here, so publishConfig.exports applies.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.6

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.TOKEN }}
