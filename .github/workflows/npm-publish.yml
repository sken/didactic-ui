# Publishes @sken/color-picker to npm when a GitHub release is created, or
# when started by hand (Actions > Node.js Package > Run workflow).
# The version comes from packages/color-picker/package.json (set it with
# `pnpm changeset version`). A version that is already on npm is skipped.

name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.6

      - run: pnpm install --frozen-lockfile

      - name: Lint, test, build
        run: |
          pnpm run lint
          pnpm run test
          pnpm --filter @sken/color-picker build

      - name: Check the version is not on npm yet
        id: check
        working-directory: packages/color-picker
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@sken/color-picker@$VERSION" version >/dev/null 2>&1; then
            echo "@sken/color-picker@$VERSION is already published, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # pnpm (not npm) publish: it applies publishConfig.exports (types from dist)
      - name: Publish @sken/color-picker
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/color-picker
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.TOKEN }}
